<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" fill="none" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="70%">
      <stop offset="0" stop-color="#5e9eff" stop-opacity="0.14"/><stop offset="1" stop-color="#5e9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#c9d8f5"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ab4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-360 0" to="720 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="58" y="168" width="0" height="36">
        <animate attributeName="width" from="0" to="620" dur="2.4s" begin="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="15.25" stroke="#30363d" stroke-width="1.5"/>

  <!-- constellation, drawing itself in -->
  <g stroke="#5e9eff" stroke-width="1.5" opacity="0.5">
    <line x1="700" y1="80" x2="778" y2="132" stroke-dasharray="94" stroke-dashoffset="94">
      <animate attributeName="stroke-dashoffset" from="94" to="0" dur="0.9s" begin="0.4s" fill="freeze"/>
    </line>
    <line x1="778" y1="132" x2="726" y2="212" stroke-dasharray="96" stroke-dashoffset="96">
      <animate attributeName="stroke-dashoffset" from="96" to="0" dur="0.9s" begin="1.0s" fill="freeze"/>
    </line>
    <line x1="726" y1="212" x2="646" y2="160" stroke-dasharray="96" stroke-dashoffset="96">
      <animate attributeName="stroke-dashoffset" from="96" to="0" dur="0.9s" begin="1.6s" fill="freeze"/>
    </line>
    <line x1="646" y1="160" x2="700" y2="80" stroke-dasharray="97" stroke-dashoffset="97">
      <animate attributeName="stroke-dashoffset" from="97" to="0" dur="0.9s" begin="2.2s" fill="freeze"/>
    </line>
    <line x1="778" y1="132" x2="846" y2="96" stroke-dasharray="77" stroke-dashoffset="77">
      <animate attributeName="stroke-dashoffset" from="77" to="0" dur="0.8s" begin="2.8s" fill="freeze"/>
    </line>
    <line x1="726" y1="212" x2="812" y2="240" stroke-dasharray="91" stroke-dashoffset="91">
      <animate attributeName="stroke-dashoffset" from="91" to="0" dur="0.8s" begin="3.2s" fill="freeze"/>
    </line>
  </g>
  <g fill="#5e9eff">
    <circle cx="700" cy="80" r="5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </circle>
    <circle cx="778" cy="132" r="5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    </circle>
    <circle cx="726" cy="212" r="5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
    </circle>
    <circle cx="646" cy="160" r="5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    </circle>
    <circle cx="846" cy="96" r="4" fill="#9bb6e0" opacity="0">
      <animate attributeName="opacity" from="0" to="0.8" dur="0.4s" begin="3.0s" fill="freeze"/>
    </circle>
    <circle cx="812" cy="240" r="4" fill="#9bb6e0" opacity="0">
      <animate attributeName="opacity" from="0" to="0.8" dur="0.4s" begin="3.4s" fill="freeze"/>
    </circle>
  </g>
  <circle cx="712" cy="146" r="8" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.4s" fill="freeze"/>
  </circle>
  <circle cx="712" cy="146" r="16" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/>
    <animate attributeName="r" values="14;18;14" dur="4s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- name, sliding up with a shimmer that never stops -->
  <g opacity="0" transform="translate(0 14)">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.15s" fill="freeze"/>
    <text x="56" y="128" font-size="54" font-weight="700" letter-spacing="-1" fill="url(#shine)">Sushant Lokhande</text>
  </g>

  <!-- typed subtitle -->
  <text x="58" y="196" font-size="21" fill="#8b949e" clip-path="url(#typeclip)" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, monospace">software engineer · full stack, ML, and the systems underneath</text>
  <rect x="686" y="178" width="10" height="22" fill="#5e9eff" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- closing line -->
  <text x="58" y="246" font-size="16" fill="#6e7681" opacity="0">building Proxima, Relay, and GradeMesh · open to SWE, ML, and AI roles
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.6s" fill="freeze"/>
  </text>
</svg>
