<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" fill="none" font-family="ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="45%" r="70%">
      <stop offset="0" stop-color="#5e9eff" stop-opacity="0.12"/><stop offset="1" stop-color="#5e9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#c9d8f5"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ab4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-320 0" to="640 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" stroke="#30363d" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="t1"><rect x="60" y="88" width="0" height="24"><animate attributeName="width" from="0" to="95" dur="0.5s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="60" y="152" width="0" height="24"><animate attributeName="width" from="0" to="380" dur="1.1s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="60" y="186" width="0" height="24"><animate attributeName="width" from="0" to="118" dur="0.5s" begin="3.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="60" y="214" width="0" height="24"><animate attributeName="width" from="0" to="315" dur="1.0s" begin="4.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>
  <rect width="900" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="15.25" stroke="#30363d" stroke-width="1.5"/>

  <!-- terminal window -->
  <rect x="36" y="44" width="540" height="212" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="36" y="44" width="540" height="34" rx="12" fill="#1c2129"/>
  <rect x="36" y="66" width="540" height="12" fill="#1c2129"/>
  <circle cx="60" cy="61" r="6" fill="#ff5f57"/>
  <circle cx="82" cy="61" r="6" fill="#febc2e"/>
  <circle cx="104" cy="61" r="6" fill="#28c840"/>
  <text x="306" y="66" text-anchor="middle" font-size="12" fill="#6e7681">sushant@world: ~</text>

  <!-- $ whoami -->
  <text x="60" y="106" font-size="16" clip-path="url(#t1)"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3" dx="8">whoami</tspan></text>

  <!-- the answer, big, shimmering -->
  <g opacity="0" transform="translate(0 10)">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.6s" begin="1.15s" fill="freeze"/>
    <text x="60" y="142" font-size="32" font-weight="700" letter-spacing="-0.5" fill="url(#shine)" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Sushant Lokhande</text>
  </g>
  <text x="60" y="170" font-size="15" fill="#8b949e" clip-path="url(#t2)">full stack · ML · the systems underneath</text>

  <!-- $ vibe_check -->
  <text x="60" y="204" font-size="16" clip-path="url(#t3)"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3" dx="8">vibe_check</tspan></text>
  <text x="60" y="232" font-size="15" clip-path="url(#t4)"><tspan fill="#7ee787">low latency. high recall. no cap.</tspan></text>
  <rect x="382" y="218" width="9" height="18" fill="#5e9eff" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="5.6s" repeatCount="indefinite"/>
  </rect>

  <!-- vector graph: edges draw in, queries travel the graph -->
  <g stroke="#5e9eff" stroke-width="1.5" opacity="0.55">
    <path id="e1" d="M640 104 L744 82" stroke-dasharray="107" stroke-dashoffset="107">
      <animate attributeName="stroke-dashoffset" from="107" to="0" dur="0.7s" begin="0.5s" fill="freeze"/>
    </path>
    <path id="e2" d="M744 82 L832 138" stroke-dasharray="105" stroke-dashoffset="105">
      <animate attributeName="stroke-dashoffset" from="105" to="0" dur="0.7s" begin="1.1s" fill="freeze"/>
    </path>
    <path id="e3" d="M640 104 L706 172" stroke-dasharray="95" stroke-dashoffset="95">
      <animate attributeName="stroke-dashoffset" from="95" to="0" dur="0.7s" begin="1.7s" fill="freeze"/>
    </path>
    <path id="e4" d="M706 172 L832 138" stroke-dasharray="131" stroke-dashoffset="131">
      <animate attributeName="stroke-dashoffset" from="131" to="0" dur="0.7s" begin="2.3s" fill="freeze"/>
    </path>
    <path id="e5" d="M706 172 L628 192" stroke-dasharray="81" stroke-dashoffset="81">
      <animate attributeName="stroke-dashoffset" from="81" to="0" dur="0.6s" begin="2.9s" fill="freeze"/>
    </path>
    <path id="e6" d="M832 138 L812 198" stroke-dasharray="64" stroke-dashoffset="64">
      <animate attributeName="stroke-dashoffset" from="64" to="0" dur="0.6s" begin="3.4s" fill="freeze"/>
    </path>
  </g>
  <g fill="#5e9eff">
    <circle cx="640" cy="104" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/></circle>
    <circle cx="744" cy="82" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/></circle>
    <circle cx="832" cy="138" r="5" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/></circle>
    <circle cx="628" cy="192" r="4" fill="#9bb6e0" opacity="0"><animate attributeName="opacity" from="0" to="0.8" dur="0.4s" begin="3.0s" fill="freeze"/></circle>
    <circle cx="812" cy="198" r="4" fill="#9bb6e0" opacity="0"><animate attributeName="opacity" from="0" to="0.8" dur="0.4s" begin="3.5s" fill="freeze"/></circle>
  </g>
  <circle cx="706" cy="172" r="7" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
  </circle>
  <circle cx="706" cy="172" r="14" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
    <animate attributeName="r" values="12;17;12" dur="3.5s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- query pulses riding the edges -->
  <circle r="3.5" fill="#e6edf3" opacity="0.9">
    <animateMotion dur="1.6s" begin="3.6s" repeatCount="indefinite"><mpath href="#e1" xlink:href="#e1"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#e6edf3" opacity="0.9">
    <animateMotion dur="1.8s" begin="4.2s" repeatCount="indefinite"><mpath href="#e4" xlink:href="#e4"/></animateMotion>
  </circle>
  <circle r="3" fill="#7ee787" opacity="0.9">
    <animateMotion dur="2.1s" begin="4.8s" repeatCount="indefinite"><mpath href="#e3" xlink:href="#e3"/></animateMotion>
  </circle>

  <!-- what's cooking -->
  <text x="732" y="242" text-anchor="middle" font-size="12.5" fill="#6e7681" opacity="0">building: proxima · relay · autograde ai
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="4.6s" fill="freeze"/>
  </text>
</svg>
